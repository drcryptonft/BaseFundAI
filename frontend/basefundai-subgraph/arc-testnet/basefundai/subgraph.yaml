specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Factory
    network: base-sepolia
    source:
      address: "0x1c20832065121f0719fEe423ED1899eb84A784Ab"
      abi: Factory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CampaignCreated
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: CampaignCreated(indexed address,indexed address,uint256,uint256)
          handler: handleCampaignCreated
      file: ./src/factory.ts
